user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format ctps_json escape=json '{"timestamp":"$time_iso8601","service":"nginx","requestId":"$request_id","remote":"$remote_addr","method":"$request_method","host":"$host","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /var/log/nginx/access.log ctps_json;
  error_log /var/log/nginx/error.log warn;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  client_max_body_size 60m;
  proxy_connect_timeout 10s;
  proxy_read_timeout 90s;
  proxy_send_timeout 90s;
  include /etc/nginx/conf.d/*.conf;
}
