services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctps_local_development_only}
      POSTGRES_DB: ${POSTGRES_DB:-ctps}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ctps_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  ctps_postgres_data:
